{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="row justify-content-center pt-3">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="p-2 bg-primary-subtle text-primary rounded-circle d-inline-flex mb-2">
            <i class="bi bi-lock-fill fs-4 px-1"></i>
          </div>
          <h4 class="fw-bold mb-1">Welcome Back</h4>
          <p class="text-muted small">Sign in to your MindTrack Pro account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" name="email" placeholder="name@example.com" required autocomplete="email">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>
          <button class="btn btn-primary w-100 py-2 fw-semibold mt-2" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
